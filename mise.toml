[tools]
go = "1.27"

[tasks.setup]
description = "One command after cloning: enable the pre-commit gate"
run = """
# Without a local hooksPath when the global ct-hook-dispatch exists.
hooks_dir=$(git config --global --get core.hooksPath) || hooks_dir=
case "$hooks_dir" in
  "~") hooks_dir=$HOME ;;
  "~/"*) hooks_dir="$HOME/${hooks_dir#"~/"}" ;;
esac
if [ -n "$hooks_dir" ] && [ -x "$hooks_dir/ct-hook-dispatch" ]; then
  [ "$(git config --local --get core.hooksPath)" = ".githooks" ] && git config --local --unset core.hooksPath
  echo 'git hooks: global dispatcher runs .githooks'
else
  git config core.hooksPath .githooks
fi
echo
echo 'Setup complete. Next:'
echo '  mise run ci:fast  the fast gate, also runs on pre-commit'
"""

[tasks.test]
description = "Run formatter unit tests"
run = "go test ./..."

[tasks.lint]
description = "Static checks, read-only"
run = "go vet ./..."

[tasks.fmt]
description = "Rewrite Go sources with gofmt"
run = "gofmt -w ."

[tasks."fmt:check"]
description = "Fail if any Go source is not gofmt-clean"
run = """
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "gofmt needed (run: mise run fmt):"
  echo "$unformatted"
  exit 1
fi
"""

# The three DLV-002 levels share one check set: the whole suite runs in about a
# second, so there is nothing for a heavier level to add (CLAUDE.md, ## CI levels).
# The steps live in the body, never `depends`: the first line is the ci-slot guard
# and a dependency would run before it.
[tasks."ci:fast"]
# `ct ci install` wrote .mise/lib/ci-slot; the pin and the green stamp are its v4 body.
description = "Fast level: gofmt check, go vet, tests; pre-commit runs it"
run = '''
.mise/lib/ci-slot --own-tree
set -e
export CI_SLOT_GREEN_START="$(.mise/lib/ci-slot --tree-hash)"
mise run fmt:check
mise run lint
mise run test
.mise/lib/ci-slot --mark-green ci:fast
'''

[tasks.ci]
# Run once when the change is done; the guard re-enters this task inside a slot.
description = "Change level: the fast checks and every test, once per change"
run = '''
[ -n "${CI_SLOT:-}" ] || exec .mise/lib/ci-slot ci
set -e
mise run ci:fast
'''

[tasks."ci:full"]
# Equal to `ci` until this repo has a check that is too heavy for it.
description = "Full level: the same checks and tests, in a slot; `ci` equals it"
run = '''
[ -n "${CI_SLOT:-}" ] || exec .mise/lib/ci-slot ci:full
set -e
mise run ci
'''

# Asset names must stay fenv_<os>_<arch>: `mise use github:cuongtransc/format-env`
# picks the release asset by that suffix and installs it as `fenv`.
[tasks.build]
description = "Cross-compile release binaries into bin/"
run = """
set -e
# The tag on HEAD for a release build (v1.2.1), else the nearest tag plus commits.
version=$(git describe --tags --always --dirty)
mkdir -p bin
for os in darwin linux; do
  for arch in amd64 arm64; do
    CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=$version" -o "bin/fenv_${os}_${arch}" fenv.go
    echo "built bin/fenv_${os}_${arch}"
  done
done
# Upload with the binaries: `sha256sum -c sha256sums.txt` verifies a download, and
# provisioning (ansible get_url checksum=) pins these values.
if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
(cd bin && $sum fenv_darwin_amd64 fenv_darwin_arm64 fenv_linux_amd64 fenv_linux_arm64 > sha256sums.txt)
echo "wrote bin/sha256sums.txt"
"""

# Builds for the host only. Override the target dir: BIN_DIR=/usr/local/bin
# (needs write access there). Not `go install`: that names the binary format-env.
[tasks."cli:install"]
description = "Build fenv for this machine and install it into ~/.local/bin"
run = """
set -e
bin_dir=${BIN_DIR:-$HOME/.local/bin}
mkdir -p "$bin_dir"
CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty)" -o "$bin_dir/fenv" fenv.go
echo "installed $bin_dir/fenv"
case ":$PATH:" in
  *":$bin_dir:"*) ;;
  *) echo "warning: $bin_dir is not on PATH; add to ~/.bashrc or ~/.zshrc:"
     echo "  export PATH=\\"$bin_dir:\\$PATH\\"" ;;
esac
"""

[tasks.clean]
description = "Delete build artifacts"
run = "rm -rf bin"
