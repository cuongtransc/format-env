[tools]
go = "1.27"

[tasks.test]
description = "Run formatter unit tests"
run = "go test ./..."

[tasks.lint]
description = "Static checks, read-only"
run = "go vet ./..."

[tasks.fmt]
description = "Rewrite Go sources with gofmt"
run = "gofmt -w ."

[tasks."fmt:check"]
description = "Fail if any Go source is not gofmt-clean"
run = """
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "gofmt needed (run: mise run fmt):"
  echo "$unformatted"
  exit 1
fi
"""

[tasks.ci]
description = "Gate before pushing: format check, lint, tests"
depends = ["fmt:check", "lint", "test"]
run = "echo 'ci passed'"

# Asset names must stay fenv_<os>_<arch>: `mise use github:cuongnbms/format-env`
# picks the release asset by that suffix and installs it as `fenv`.
[tasks.build]
description = "Cross-compile release binaries into bin/"
run = """
set -e
mkdir -p bin
for os in darwin linux; do
  for arch in amd64 arm64; do
    CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "bin/fenv_${os}_${arch}" fenv.go
    echo "built bin/fenv_${os}_${arch}"
  done
done
"""

# Builds for the host only. Override the target dir: BIN_DIR=/usr/local/bin
# (needs write access there). Not `go install`: that names the binary format-env.
[tasks."cli:install"]
description = "Build fenv for this machine and install it into ~/.local/bin"
run = """
set -e
bin_dir=${BIN_DIR:-$HOME/.local/bin}
mkdir -p "$bin_dir"
CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$bin_dir/fenv" fenv.go
echo "installed $bin_dir/fenv"
case ":$PATH:" in
  *":$bin_dir:"*) ;;
  *) echo "warning: $bin_dir is not on PATH; add to ~/.bashrc or ~/.zshrc:"
     echo "  export PATH=\\"$bin_dir:\\$PATH\\"" ;;
esac
"""

[tasks.clean]
description = "Delete build artifacts"
run = "rm -rf bin"
